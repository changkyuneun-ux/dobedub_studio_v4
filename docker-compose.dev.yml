services:
  mysql:
    image: mysql:8.0
    container_name: dobedub-studio-mysql
    environment:
      MYSQL_DATABASE: dobedub_studio
      MYSQL_USER: dobedub
      MYSQL_PASSWORD: dobedub_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - dobedub_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    container_name: dobedub-studio-localstack
    profiles:
      - s3
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ap-northeast-2
    ports:
      - "4566:4566"
    volumes:
      - dobedub_localstack_data:/var/lib/localstack

volumes:
  dobedub_mysql_data:
  dobedub_localstack_data:
